{% extends 'base.html' %}{% block content %}<div class="detail"><div class="product-art large">{{ p.category[:2]|upper }}</div><div><span class="eyebrow">{{ p.sku }} · {{ p.vehicle_type }}</span><h1>{{ p.name }}</h1><p>{{ p.description }}</p><h2>{{ money(p.price) }}</h2><p>{{ p.stock }} units available</p><form method="post" action="{{ url_for('add_cart',pid=p.id) }}" class="inline"><input type="number" name="quantity" value="1" min="1" max="{{ p.stock }}"><button class="btn" {% if p.stock<1 %}disabled{% endif %}>Add to cart</button></form></div></div>{% endblock %}
