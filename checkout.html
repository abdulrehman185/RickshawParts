{% extends 'base.html' %}{% block content %}<div class="page-head"><span class="eyebrow">ALMOST THERE</span><h1>Delivery details</h1></div><form method="post" class="form-card"><label>Full name<input name="name" required></label><label>Phone number<input name="phone" required placeholder="03xx-xxxxxxx"></label><label>Delivery address<textarea name="address" required rows="3"></textarea></label><label>Payment method<select name="payment_method"><option>Cash on Delivery</option><option>Bank Transfer (manual confirmation)</option><option>Mobile Wallet (manual confirmation)</option></select></label><button class="btn">Place order</button><p class="muted">Online payment is not processed by this MVP. Non-COD methods require manual confirmation.</p></form>{% endblock %}
